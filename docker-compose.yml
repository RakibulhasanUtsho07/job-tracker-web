services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-hireflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hireflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireflow} -d ${POSTGRES_DB:-hireflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hireflow_postgres_data:
